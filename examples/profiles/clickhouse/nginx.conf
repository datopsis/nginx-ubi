worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_request_id $correlation_id {
        "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $http_x_request_id;
        default $request_id;
    }

    # A connection that never produced a request has no method: a failed TLS
    # handshake, a malformed request line, or a client that disconnects before
    # the request is read. Those are not application requests, so they stay in
    # the error stream instead of emitting a structured access event with empty
    # fields.
    map $request_method $is_application_request {
        default 1;
        ""      0;
    }

    # ClickHouse reports failures with a numeric exception code in a response
    # header. Recording it gives operators the failure class without putting
    # any part of the query text into the log.
    map $upstream_http_x_clickhouse_exception_code $clickhouse_exception_code {
        default $upstream_http_x_clickhouse_exception_code;
        ""      NONE;
    }

    # A request the proxy refuses never reaches an upstream, so every upstream
    # variable is empty. Naming that case keeps each field in the access event
    # non-empty and keeps "the database rejected this" distinguishable from
    # "the database never saw it", which is the difference between a query
    # problem and a gateway problem.
    map $upstream_addr $upstream_addr_value {
        default $upstream_addr;
        ""      NONE;
    }

    map $upstream_status $upstream_status_value {
        default $upstream_status;
        ""      NONE;
    }

    map $upstream_connect_time $upstream_connect_time_value {
        default $upstream_connect_time;
        ""      NONE;
    }

    map $upstream_header_time $upstream_header_time_value {
        default $upstream_header_time;
        ""      NONE;
    }

    map $upstream_response_time $upstream_response_time_value {
        default $upstream_response_time;
        ""      NONE;
    }

    # The access event records $uri and never $request, $request_uri, or $args.
    #
    # That rule matters more here than anywhere else in this repository. The
    # ClickHouse HTTP interface accepts `?query=...` and, on many deployments,
    # `?user=...&password=...`, so the request target routinely carries both
    # credentials and customer data. Logging the request line would write
    # passwords and query text into the access stream, from where they spread
    # into collectors, retention, and backups.
    log_format profile_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$correlation_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"clickhouse_exception_code":"$clickhouse_exception_code",'
        '"upstream_addr":"$upstream_addr_value",'
        '"upstream_status":"$upstream_status_value",'
        '"upstream_connect_time":"$upstream_connect_time_value",'
        '"upstream_header_time":"$upstream_header_time_value",'
        '"upstream_response_time":"$upstream_response_time_value"}';
    access_log /dev/stdout profile_json if=$is_application_request;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server_tokens off;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # Replace this endpoint with the deployment's approved service name.
    upstream clickhouse_backend {
        server backend:8123;
        keepalive 8;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $correlation_id always;

        # This proxy is not an authorization boundary.
        #
        # NGINX parses HTTP, not SQL. It cannot make a session read-only,
        # restrict which statements run, bound how many rows a query returns,
        # or tell a SELECT from a DROP. Anything that depends on the content of
        # a query belongs to ClickHouse: `readonly` user settings, quotas, row
        # policies, and per-user grants. Treating this file as the control that
        # keeps clients from modifying data is a misreading of what it does.
        location = /query {
            proxy_pass http://clickhouse_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $correlation_id;

            # Queries are sent as a request body. Inserts need a deliberately
            # larger value; raise it with a stated reason rather than removing
            # the bound, because an unbounded body lets one client occupy
            # temporary storage on the way to the database.
            client_max_body_size 10m;

            # Analytical queries run far longer than web requests. The timeout
            # is scoped to this location so an ordinary endpoint cannot inherit
            # it, and each waiting query still holds a worker connection, so
            # size `worker_connections` for the expected concurrent query count
            # rather than for request rate.
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # A result set larger than the proxy buffers would otherwise spill
            # to `proxy_temp_path`, which is on the container's `/tmp` tmpfs.
            # A single large result could then consume the tmpfs and take the
            # container down with it. Streaming the response to the client
            # instead keeps memory and temporary storage bounded.
            proxy_max_temp_file_size 0;
            proxy_buffering off;

            # A retry would re-execute the statement. That is unsafe for
            # anything that writes, and wasteful for anything that does not.
            proxy_next_upstream off;

            limit_except GET HEAD POST {
                deny all;
            }
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
