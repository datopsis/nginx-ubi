worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_request_id $correlation_id {
        "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $http_x_request_id;
        default $request_id;
    }

    # A connection that never produced a request has no method: a failed TLS
    # handshake, a malformed request line, or a client that disconnects before
    # the request is read. Those are not application requests, so they stay in
    # the error stream instead of emitting a structured access event with empty
    # fields.
    map $request_method $is_application_request {
        default 1;
        ""      0;
    }

    # On failover the upstream variables carry one entry per attempt, so these
    # fields stay strings rather than numbers. A reader that needs per-attempt
    # values splits on ", " and treats ":" as an attempt boundary within a
    # single upstream group.
    log_format profile_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$correlation_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time"}';
    access_log /dev/stdout profile_json if=$is_application_request;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # Replace these endpoints with the deployment's approved service names.
    # NGINX resolves them once when the configuration loads, so a pool whose
    # membership changes at runtime needs a reviewed resolver configuration
    # rather than this static form.
    #
    # Weighted round robin is the default and is used deliberately: it needs no
    # shared state between workers and distributes predictably. `least_conn`
    # suits long-lived or uneven requests; a hash method suits affinity. Change
    # it only with a stated reason, because the choice changes failure
    # behaviour under load.
    #
    # `max_fails` and `fail_timeout` are passive checks. NGINX open source has
    # no active upstream probing, so a member is only marked down after real
    # requests fail. Sizing these too aggressively removes capacity during a
    # transient blip; too loosely keeps sending traffic to a dead member.
    upstream application_pool {
        server backend-a:8080 max_fails=2 fail_timeout=5s;
        server backend-b:8080 max_fails=2 fail_timeout=5s;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $correlation_id always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://application_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Retry another member only for failures that happened before the
            # application observed the request. `non_idempotent` is deliberately
            # absent: replaying a POST, PATCH, or DELETE that may already have
            # been applied is a correctness and duplicate-side-effect risk, not
            # an availability improvement.
            #
            # Both bounds are set so a failing pool cannot multiply one client
            # request into an unbounded amount of upstream work.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }
    }
}
