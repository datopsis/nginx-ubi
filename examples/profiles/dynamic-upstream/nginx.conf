worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_request_id $correlation_id {
        "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $http_x_request_id;
        default $request_id;
    }

    # A connection that never produced a request has no method: a failed TLS
    # handshake, a malformed request line, or a client that disconnects before
    # the request is read. Those are not application requests, so they stay in
    # the error stream instead of emitting a structured access event with empty
    # fields.
    map $request_method $is_application_request {
        default 1;
        ""      0;
    }

    # A request that fails before reaching an upstream has no upstream values.
    # Naming that case keeps every field non-empty and keeps "the upstream
    # answered badly" distinguishable from "no upstream was reached", which
    # here is usually a resolver problem rather than an application one.
    map $upstream_addr $upstream_addr_value {
        default $upstream_addr;
        ""      NONE;
    }

    map $upstream_status $upstream_status_value {
        default $upstream_status;
        ""      NONE;
    }

    map $upstream_connect_time $upstream_connect_time_value {
        default $upstream_connect_time;
        ""      NONE;
    }

    map $upstream_header_time $upstream_header_time_value {
        default $upstream_header_time;
        ""      NONE;
    }

    map $upstream_response_time $upstream_response_time_value {
        default $upstream_response_time;
        ""      NONE;
    }

    log_format profile_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$correlation_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr_value",'
        '"upstream_status":"$upstream_status_value",'
        '"upstream_connect_time":"$upstream_connect_time_value",'
        '"upstream_header_time":"$upstream_header_time_value",'
        '"upstream_response_time":"$upstream_response_time_value"}';
    access_log /dev/stdout profile_json if=$is_application_request;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # The deployment supplies its own resolver by mounting this file, because
    # the correct address is a property of the platform rather than of this
    # configuration. NGINX does not read /etc/resolv.conf for this purpose, so
    # there is no usable default and a wrong value fails every request.
    #
    # The mounted file contains one directive, for example:
    #
    #     resolver 10.96.0.10 valid=30s ipv6=off;
    #
    # `valid` bounds how long a resolved address is reused and therefore how
    # long traffic can keep going to a replaced endpoint. Setting it below the
    # record's own TTL does not make failover faster than the zone allows.
    #
    # DNS is part of the trust boundary in this profile. A resolver that
    # returns an attacker-controlled address redirects traffic for the life of
    # the cache entry, and unlike the static profile there is no reload or
    # review step in between. Use a resolver the deployment controls.
    include /etc/nginx/resolver.conf;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $correlation_id always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            # The endpoint is held in a variable deliberately. That is what
            # makes NGINX resolve it per request instead of once at load, and
            # it is also what costs this profile the upstream block. Replace
            # the value with the deployment's approved service name.
            set $application_endpoint "backend:8080";

            # With a variable and no URI part, NGINX passes the request URI
            # through unchanged. The URI-substitution rule that catches people
            # applies when proxy_pass carries a URI part of its own, which this
            # one deliberately does not.
            #
            # Appending `$request_uri` here would be redundant rather than
            # safer: path, query string, and normalisation of a traversal
            # segment were compared both ways against this image and behave
            # identically, matching the static profile.
            proxy_pass http://$application_endpoint;

            proxy_http_version 1.1;
            proxy_set_header Host $application_endpoint;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # There is no peer set to fail over to, so this is off for the same
            # reason it is off in the static profile rather than a different
            # one: a retry would repeat a request the application may already
            # have acted on.
            proxy_next_upstream off;
        }
    }
}
