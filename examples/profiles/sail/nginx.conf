worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_request_id $correlation_id {
        "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $http_x_request_id;
        default $request_id;
    }

    map $request_method $is_application_request {
        default 1;
        ""      0;
    }

    log_format tls_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$correlation_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"tls_protocol":"$ssl_protocol",'
        '"tls_cipher":"$ssl_cipher",'
        '"tls_server_name":"$ssl_server_name",'
        '"tls_session_reused":"$ssl_session_reused",'
        '"tls_client_verify":"$ssl_client_verify"}';
    access_log /dev/stdout tls_json if=$is_application_request;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server_tokens off;
    client_max_body_size 64m;
    client_body_timeout 3600s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 3600s;

    server {
        listen 50051 ssl default_server;
        listen [::]:50051 ssl default_server;
        server_name sail;
        http2 on;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_ecdh_curve X25519:secp256r1;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $correlation_id always;

        location / {
            # Backend shares this namespace and binds ONLY to 127.0.0.1.
            grpc_pass grpc://127.0.0.1:50052;
            grpc_set_header Host $http_host;
            grpc_set_header X-Forwarded-For $remote_addr;
            grpc_set_header X-Forwarded-Proto $scheme;
            grpc_set_header X-Forwarded-Host $http_host;
            grpc_set_header Forwarded "";
            grpc_set_header X-Request-ID $correlation_id;
            grpc_connect_timeout 5s;
            # Idle intervals, not total RPC duration. Preserve native gRPC trailers.
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_next_upstream off;
            grpc_intercept_errors off;
        }
    }
}
