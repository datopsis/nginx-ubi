worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_request_id $correlation_id {
        "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $http_x_request_id;
        default $request_id;
    }

    # A connection that never produced a request has no method: a failed TLS
    # handshake, a malformed request line, or a client that disconnects before
    # the request is read. Those are not application requests, so they stay in
    # the error stream instead of emitting a structured access event with empty
    # fields.
    map $request_method $is_application_request {
        default 1;
        ""      0;
    }

    # Probes run continuously, so a successful readiness check is not an event
    # worth recording; a failing one is. Logging only failures keeps the signal
    # visible without burying real traffic under probe noise.
    map $status $is_failed_probe {
        default 1;
        200     0;
    }

    log_format profile_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$correlation_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time"}';
    access_log /dev/stdout profile_json if=$is_application_request;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # Replace this endpoint with the deployment's approved service name.
    upstream application_backend {
        server backend:8080;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $correlation_id always;

        # Liveness: is this process able to serve at all?
        #
        # It must never depend on an upstream. A liveness probe that fails
        # because a backend is down makes the orchestrator kill and restart
        # healthy proxies, converting a dependency outage into a restart storm
        # that removes the capacity needed to recover. Liveness answers only
        # for this process.
        location = /healthz {
            access_log off;
            add_header Cache-Control "no-store" always;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Readiness: should this instance receive traffic right now?
        #
        # Unlike liveness this does depend on the upstream, because an instance
        # that cannot reach its backend has nothing useful to serve. A failing
        # readiness probe removes the instance from rotation; it does not
        # restart it.
        #
        # The timeouts are deliberately shorter than a typical probe interval.
        # A readiness check that outlives its own probe period stacks
        # concurrent probes against an already struggling upstream.
        location = /readyz {
            access_log /dev/stdout profile_json if=$is_failed_probe;
            add_header Cache-Control "no-store" always;

            proxy_pass http://application_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
            proxy_next_upstream off;

            # Report the upstream's failure as this instance being unready,
            # rather than passing an upstream 502 through as if the proxy
            # itself had failed.
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @unready;
        }

        location @unready {
            add_header Cache-Control "no-store" always;
            default_type text/plain;
            return 503 "not ready\n";
        }

        location / {
            proxy_pass http://application_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_next_upstream off;
        }
    }

    # Operator status surface, on a separate listener from application traffic.
    #
    # `stub_status` reports connection and request counters. They are not
    # secrets, but they describe load and capacity, so the default here is to
    # serve nobody. A deployment that scrapes this must make a reviewed change
    # naming the collector's source range, and must keep this port off any
    # public ingress. Binding it to a second port rather than a path under the
    # application server is what lets network policy separate the two.
    server {
        listen 8081;
        listen [::]:8081;
        server_name _;

        access_log off;

        location = /status {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            stub_status;
        }

        location / {
            return 404;
        }
    }
}
