worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_request_id $correlation_id {
        "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $http_x_request_id;
        default $request_id;
    }

    # A connection that never produced a request has no method: a failed TLS
    # handshake, a malformed request line, or a client that disconnects before
    # the request is read. Those are not application requests, so they stay in
    # the error stream instead of emitting a structured access event with empty
    # fields.
    map $request_method $is_application_request {
        default 1;
        ""      0;
    }

    # An upgraded connection needs `Connection: upgrade`, and every other
    # request needs `Connection: close` so a proxied connection is never
    # accidentally reused as if it were still a plain HTTP keepalive. The value
    # is derived here rather than copied from the client, so a client cannot
    # choose the connection disposition sent upstream.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    log_format profile_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$correlation_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"connection_upgrade":"$connection_upgrade",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time"}';
    access_log /dev/stdout profile_json if=$is_application_request;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # Replace this endpoint with the deployment's approved service name.
    #
    # There is deliberately no `keepalive` directive here. An upgraded
    # connection is not returned to a keepalive pool, so the pool would only
    # serve the plain HTTP location while adding a second lifecycle to reason
    # about on the same upstream.
    upstream websocket_backend {
        server backend:8080;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $correlation_id always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Upgrade-capable location.
        #
        # NGINX does not validate `Origin` and this profile does not add that
        # check. Browsers do not apply the same-origin policy to WebSocket
        # handshakes, so an application that authenticates with cookies alone
        # is exposed to cross-site WebSocket hijacking. Origin or token
        # validation belongs to the application or an authenticating layer, and
        # is a deployment responsibility rather than a property of this file.
        location /ws {
            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_connect_timeout 5s;

            # An idle WebSocket sends nothing for long periods, so the read
            # timeout has to exceed the application's own idle or ping
            # interval or NGINX closes a healthy session. It is scoped to this
            # location: the plain HTTP location keeps the short timeout, so a
            # slow or stuck HTTP upstream cannot hold a worker connection for
            # an hour.
            #
            # Each idle session still occupies a worker connection on both
            # sides. Size `worker_connections` and any per-client connection
            # limit for the expected concurrent session count rather than for
            # request rate.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # An upgrade must never be retried against another member. The
            # handshake is not idempotent, and a retry after the client has
            # started speaking the upgraded protocol cannot be replayed.
            proxy_next_upstream off;
        }

        # Plain HTTP for the same application, with the ordinary timeouts.
        location / {
            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_next_upstream off;
        }
    }
}
