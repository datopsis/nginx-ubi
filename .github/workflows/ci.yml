name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --disable-pip-version-check
          --requirement .github/requirements/pre-commit.txt

      - name: Run repository checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Validate artifact locks and component accountability
        run: >-
          python -m unittest
          tests.test_artifacts tests.test_assembly_isolation tests.test_components
          tests.test_control_model tests.test_diagrams
          tests.test_nginx_features tests.test_profile_logs
          tests.test_input_drift tests.test_profile_policy tests.test_release_tag
          tests.test_tls_material tests.test_transfer -v

      - name: Check the requirement trace matrix is current
        run: python scripts/build-trace-matrix.py --check

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          min-severity: medium

  configuration-security:
    name: configuration security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  image:
    name: image (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      TEST_IMAGE: localhost/nginx-ubi9:test-${{ matrix.architecture }}
      SBOM_FILE: nginx-ubi9-${{ matrix.architecture }}.spdx.json
      GRYPE_SARIF: grype-${{ matrix.architecture }}.sarif
      GRYPE_ALL: grype-all-${{ matrix.architecture }}.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "${EXPECTED_MACHINE}"

      - name: Confirm hermetic-build tools
        run: |
          podman version
          rpm --version
          rpmsign --version
          gpg --version | head -n 1

      - name: Acquire architecture artifact bundle
        run: >-
          python scripts/artifacts.py acquire
          --lock artifacts/locks/${{ matrix.architecture }}.json
          --output .artifact-bundle/${{ matrix.architecture }}

      - name: Verify architecture artifact bundle
        run: >-
          bash scripts/verify-rpm-bundle.sh
          artifacts/locks/${{ matrix.architecture }}.json
          .artifact-bundle/${{ matrix.architecture }}

      - name: Verify runtime component metadata
        run: >-
          python scripts/components.py
          --lock artifacts/locks/${{ matrix.architecture }}.json
          --bundle .artifact-bundle/${{ matrix.architecture }}

      - name: Reject invalid RPM bundles
        run: >-
          python tests/rpm-bundle-negative.py
          --lock artifacts/locks/${{ matrix.architecture }}.json
          --bundle .artifact-bundle/${{ matrix.architecture }}

      - name: Build without network access or image pulling
        env:
          PULL_BASES: "1"
        run: >-
          bash scripts/build-image.sh
          ${{ matrix.architecture }}
          "${TEST_IMAGE}"

      - name: Prove hermetic build boundaries fail closed
        run: bash tests/hermetic-build-negative.sh ${{ matrix.architecture }}

      - name: Run native Podman restricted-runtime tests
        env:
          CONTAINER_RUNTIME: podman
          IMAGE: ${{ env.TEST_IMAGE }}
        run: bash tests/smoke.sh

      - name: Qualify native Podman HTTP profiles
        env:
          CONTAINER_RUNTIME: podman
          IMAGE: ${{ env.TEST_IMAGE }}
        run: bash tests/profiles.sh

      - name: Qualify native Podman TLS profiles
        env:
          CONTAINER_RUNTIME: podman
          IMAGE: ${{ env.TEST_IMAGE }}
        run: bash tests/tls.sh

      - name: Transfer image to Docker compatibility environment
        run: |
          podman save --format docker-archive --output /tmp/nginx-ubi-image.tar "${TEST_IMAGE}"
          docker load --input /tmp/nginx-ubi-image.tar
          rm --force /tmp/nginx-ubi-image.tar

      - name: Confirm loaded image architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: >-
          test "$(docker image inspect --format '{{.Architecture}}' "${TEST_IMAGE}")"
          = "${EXPECTED_ARCHITECTURE}"

      - name: Run Docker compatibility restricted-runtime tests
        env:
          CONTAINER_RUNTIME: docker
          IMAGE: ${{ env.TEST_IMAGE }}
        run: bash tests/smoke.sh

      - name: Qualify Docker compatibility HTTP profiles
        env:
          CONTAINER_RUNTIME: docker
          IMAGE: ${{ env.TEST_IMAGE }}
        run: bash tests/profiles.sh

      - name: Qualify Docker compatibility TLS profiles
        env:
          CONTAINER_RUNTIME: docker
          IMAGE: ${{ env.TEST_IMAGE }}
        run: bash tests/tls.sh

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.TEST_IMAGE }}
          format: spdx-json
          output-file: ${{ env.SBOM_FILE }}
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false

      - name: Scan Syft SBOM with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ env.SBOM_FILE }}
          output-format: sarif
          output-file: ${{ env.GRYPE_SARIF }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          cache-db: true
          grype-version: v0.118.0

      - name: Record all Grype findings
        if: ${{ always() && hashFiles(env.SBOM_FILE) != '' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ env.SBOM_FILE }}
          output-format: json
          output-file: ${{ env.GRYPE_ALL }}
          severity-cutoff: negligible
          only-fixed: false
          fail-build: false
          cache-db: true
          grype-version: v0.118.0

      - name: Retain image security artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-security-${{ github.sha }}-${{ matrix.architecture }}
          path: |
            ${{ env.SBOM_FILE }}
            ${{ env.GRYPE_SARIF }}
            ${{ env.GRYPE_ALL }}
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Grype findings to code scanning
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles(env.GRYPE_SARIF) != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ env.GRYPE_SARIF }}
          category: grype-image-${{ matrix.architecture }}

  image-result:
    name: image
    if: ${{ always() }}
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native image job
        env:
          MATRIX_RESULT: ${{ needs.image.result }}
        run: test "${MATRIX_RESULT}" = success
