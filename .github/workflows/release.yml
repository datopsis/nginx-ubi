name: Release

# Runs only for an annotated tag matching the version contract. Nothing here
# triggers on a branch push, a pull request, or a schedule, and there is no
# manual dispatch: a release is caused by creating an immutable tag and by
# nothing else.
#
# This workflow has never been executed. Rehearsing it end to end from an
# untagged candidate is an open roadmap item, and until that happens its
# behaviour is asserted by reading rather than by evidence.
on:
  push:
    tags:
      - "v*"

# Read-only by default. Each job widens only what it needs, for as long as it
# needs it.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The tag must name the commit that is on main. A tag pointing at an
      # unreviewed commit would otherwise publish it.
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main" >&2
            exit 1
          fi

      - name: Validate the tag against the contract and the lock
        id: contract
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git tag --list 'v*' > /tmp/existing-tags
          # The tag being validated is already present locally, so it is
          # removed before the uniqueness and sequence checks run.
          grep -Fxv "${TAG}" /tmp/existing-tags > /tmp/other-tags || true
          python scripts/release_tag.py "${TAG}" \
            --lock artifacts/locks/amd64.json \
            --existing-tags-from /tmp/other-tags
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Confirm both architecture locks agree
        run: python -m unittest tests.test_release_tag -v

  build:
    name: build (${{ matrix.architecture }})
    needs: validate-tag
    strategy:
      fail-fast: true
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest-amd64: ${{ steps.publish.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.publish.outputs.digest-arm64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "${EXPECTED_MACHINE}"

      # Identical to the ordinary pipeline: acquisition is the only stage
      # permitted to reach the network, and assembly runs with none.
      - name: Acquire architecture artifact bundle
        run: >-
          python scripts/artifacts.py acquire
          --lock artifacts/locks/${{ matrix.architecture }}.json
          --output .artifact-bundle/${{ matrix.architecture }}

      - name: Verify architecture artifact bundle
        run: >-
          bash scripts/verify-rpm-bundle.sh
          artifacts/locks/${{ matrix.architecture }}.json
          .artifact-bundle/${{ matrix.architecture }}

      - name: Verify runtime component metadata
        run: >-
          python scripts/components.py
          --lock artifacts/locks/${{ matrix.architecture }}.json
          --bundle .artifact-bundle/${{ matrix.architecture }}

      - name: Build without network access or image pulling
        env:
          PULL_BASES: "1"
          TEST_IMAGE: localhost/nginx-ubi9:release-${{ matrix.architecture }}
        run: >-
          bash scripts/build-image.sh
          ${{ matrix.architecture }}
          "${TEST_IMAGE}"

      - name: Prove hermetic build boundaries fail closed
        run: bash tests/hermetic-build-negative.sh ${{ matrix.architecture }}

      - name: Qualify the release candidate under rootless Podman
        env:
          CONTAINER_RUNTIME: podman
          IMAGE: localhost/nginx-ubi9:release-${{ matrix.architecture }}
        run: |
          bash tests/smoke.sh
          bash tests/profiles.sh
          bash tests/tls.sh

      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" | podman login "${REGISTRY}" \
            --username "${REGISTRY_USER}" --password-stdin

      # Each architecture is pushed under its own immutable tag. The
      # multi-architecture manifest is assembled afterwards from these digests,
      # so no manifest ever references an image that was not pushed.
      - name: Publish the architecture image
        id: publish
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          target="${REGISTRY}/${IMAGE_NAME}:v${VERSION}-${ARCHITECTURE}"
          podman push \
            --digestfile /tmp/digest \
            "localhost/nginx-ubi9:release-${ARCHITECTURE}" \
            "${target}"
          echo "digest-${ARCHITECTURE}=$(cat /tmp/digest)" >> "${GITHUB_OUTPUT}"

  publish-manifest:
    name: publish manifest and evidence
    needs: [validate-tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" | podman login "${REGISTRY}" \
            --username "${REGISTRY_USER}" --password-stdin

      - name: Assemble the multi-architecture manifest
        id: manifest
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          list="${REGISTRY}/${IMAGE_NAME}:v${VERSION}"
          podman manifest create "${list}"
          for architecture in amd64 arm64; do
            podman manifest add "${list}" \
              "docker://${REGISTRY}/${IMAGE_NAME}:v${VERSION}-${architecture}"
          done
          podman manifest push --digestfile /tmp/manifest-digest "${list}" "${list}"
          echo "digest=$(cat /tmp/manifest-digest)" >> "${GITHUB_OUTPUT}"

      - name: Publish the commit traceability tag
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          short="$(git rev-parse --short "${GITHUB_SHA}")"
          podman manifest push \
            "${REGISTRY}/${IMAGE_NAME}:v${VERSION}" \
            "${REGISTRY}/${IMAGE_NAME}:sha-${short}"

      - name: Generate the SPDX inventory
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: nginx-ubi9.spdx.json

      # Signature and attestations are bound to the manifest digest, never to
      # the tag. A tag can be made to point elsewhere; a digest cannot.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v3.0.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: nginx-ubi9.spdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign the manifest digest
        env:
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: >-
          cosign sign --yes
          "${REGISTRY}/${IMAGE_NAME}@${MANIFEST_DIGEST}"

      # Verification is not decoration: it proves the signature just
      # created is discoverable and bound to this workflow's identity,
      # which is the property a consumer will actually check.
      - name: Verify the published signature
        id: verify
        env:
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp \
              "^https://github.com/${IMAGE_NAME}/\.github/workflows/release\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REGISTRY}/${IMAGE_NAME}@${MANIFEST_DIGEST}" \
            | tee cosign-verification.txt

      - name: Retain verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ needs.validate-tag.outputs.version }}
          path: |
            nginx-ubi9.spdx.json
            cosign-verification.txt
          retention-days: 90

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            printf 'Pull by digest:\n\n'
            printf '    %s/%s@%s\n\n' "${REGISTRY}" "${IMAGE_NAME}" "${DIGEST}"
            printf 'The digest, not the tag, identifies this image.\n'
          } > release-notes.txt
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.txt \
            nginx-ubi9.spdx.json cosign-verification.txt
