name: Reviewed input drift

# Dependabot proposes updates for GitHub Actions, pre-commit hooks, and the
# pinned Python assurance tools. It cannot see the inputs this project pins
# itself: the NGINX package, its signing key, the UBI base digests, and the
# locked RPM closure.
#
# This job reports on those and opens an issue. It deliberately does not open a
# pull request and cannot edit a lock, because a lock refresh is a reviewed
# operation. A bot that could perform one would be a route to changing build
# inputs without review.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Serialize scheduled/manual runs so they compare and checkpoint in order.
concurrency:
  group: reviewed-input-drift
  cancel-in-progress: false

jobs:
  report:
    name: report drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare reviewed inputs with what publishers now offer
        run: |
          python scripts/check_input_drift.py --json-output drift.json > drift.md
          cat drift.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Update the dashboard and notify on drift changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/report_input_drift.py
          --repository "${REPOSITORY}" --assignee joey-huckabee

      - name: Retain the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: input-drift-report
          path: |
            drift.md
            drift.json
          retention-days: 90
