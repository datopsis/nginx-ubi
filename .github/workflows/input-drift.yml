name: Reviewed input drift

# Dependabot proposes updates for GitHub Actions, pre-commit hooks, and the
# pinned Python assurance tools. It cannot see the inputs this project pins
# itself: the NGINX package, its signing key, the UBI base digests, and the
# locked RPM closure.
#
# This job reports on those and opens an issue. It deliberately does not open a
# pull request and cannot edit a lock, because a lock refresh is a reviewed
# operation. A bot that could perform one would be a route to changing build
# inputs without review.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: report drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare reviewed inputs with what publishers now offer
        id: drift
        run: |
          python scripts/check_input_drift.py --format markdown > drift.md
          python scripts/check_input_drift.py --format json > drift.json
          moved="$(python -c 'import json;print(json.load(open("drift.json"))["drift"])')"
          echo "moved=${moved}" >> "${GITHUB_OUTPUT}"
          cat drift.md >> "${GITHUB_STEP_SUMMARY}"

      # One open issue is kept current rather than a new one each week, so the
      # report is a standing item instead of a stream of notifications.
      - name: Open or update the drift issue
        if: steps.drift.outputs.moved != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          title="Reviewed input drift"
          existing="$(gh issue list --repo "${REPOSITORY}" \
            --state open --label input-drift --limit 1 --json number \
            --jq '.[0].number // empty')"

          {
            cat drift.md
            printf '\nGenerated by the scheduled input-drift workflow.\n'
            printf 'This issue is updated in place; it is not a proposal to merge.\n'
          } > issue-body.md

          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --repo "${REPOSITORY}" \
              --body-file issue-body.md
          else
            gh label create input-drift --repo "${REPOSITORY}" \
              --description "Reviewed build inputs have moved upstream" \
              --color FBCA04 2>/dev/null || true
            gh issue create --repo "${REPOSITORY}" \
              --title "${title}" --label input-drift --body-file issue-body.md
          fi

      - name: Close the drift issue when nothing has moved
        if: steps.drift.outputs.moved == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          existing="$(gh issue list --repo "${REPOSITORY}" \
            --state open --label input-drift --limit 1 --json number \
            --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue close "${existing}" --repo "${REPOSITORY}" \
              --comment "No drift detected in the inputs this check can read."
          fi

      - name: Retain the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: input-drift-report
          path: |
            drift.md
            drift.json
          retention-days: 90
