<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="title desc">
  <title id="title">TLS trust relationships across the three TLS profiles</title>
  <desc id="desc">Three independent trust directions. Clients verify the ingress certificate against an issuing authority the deployment operates. In mutual TLS the proxy verifies client certificates against a mounted client authority and its revocation list. For HTTPS upstreams the proxy verifies the upstream certificate chain and hostname against a mounted upstream authority and its revocation list. Every private key and certificate authority is supplied by the deployment; none is generated or held by the image.</desc>

  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>

  <text x="24" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#11181c">TLS trust</text>
  <text x="24" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Three independent directions of trust. The image holds none of the material and issues nothing.</text>

  <!-- proxy -->
  <rect x="290" y="176" width="180" height="150" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="304" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#11181c">nginx</text>
  <text x="304" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">presents the ingress</text>
  <text x="304" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">certificate and key</text>
  <text x="304" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">verifies client certs</text>
  <text x="304" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">verifies upstream chain</text>
  <text x="304" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">and hostname</text>
  <rect x="304" y="284" width="152" height="30" rx="4" fill="#ffffff" stroke="#cf222e"/>
  <text x="312" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#a40e26">issues nothing · stores nothing</text>
  <text x="312" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#a40e26">no key in the image, none in logs</text>

  <!-- client side -->
  <rect x="24" y="96" width="216" height="118" rx="6" fill="#fff8c5" stroke="#9a6700"/>
  <text x="36" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#633c01">ingress authority</text>
  <text x="36" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">operated by the deployment</text>
  <text x="36" y="154" font-family="Consolas, Menlo, monospace" font-size="9" fill="#633c01">issues → server cert + key</text>
  <text x="36" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">mounted read-only, group 0,</text>
  <text x="36" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">never writable by the runtime</text>
  <text x="36" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">renewal replaces the leaf; a reload picks it up</text>

  <path d="M240 168 L286 200" stroke="#9a6700" stroke-width="2" marker-end="url(#t-amber)"/>
  <text x="228" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#9a6700">mounted</text>

  <rect x="24" y="238" width="216" height="104" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="36" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#11181c">client</text>
  <text x="36" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">verifies the ingress certificate</text>
  <text x="36" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">against the ingress authority</text>
  <text x="36" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">in mutual TLS, also presents its</text>
  <text x="36" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">own certificate for verification</text>
  <text x="36" y="336" font-family="Consolas, Menlo, monospace" font-size="9" fill="#57606a">TLS 1.2 / 1.3 only</text>

  <path d="M240 280 L286 262" stroke="#57606a" stroke-width="2" marker-end="url(#t-grey)"/>

  <rect x="24" y="366" width="216" height="110" rx="6" fill="#fff8c5" stroke="#9a6700"/>
  <text x="36" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#633c01">client authority + CRL</text>
  <text x="36" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">mounted read-only</text>
  <text x="36" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">a valid signature is not enough:</text>
  <text x="36" y="436" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">revocation is enforced, so a</text>
  <text x="36" y="448" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">revoked client is refused</text>
  <text x="36" y="468" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">a stale CRL silently re-admits it</text>

  <path d="M240 400 L286 320" stroke="#9a6700" stroke-width="2" marker-end="url(#t-amber)"/>

  <!-- upstream side -->
  <rect x="520" y="96" width="216" height="118" rx="6" fill="#fff8c5" stroke="#9a6700"/>
  <text x="532" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#633c01">upstream authority + CRL</text>
  <text x="532" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">mounted read-only</text>
  <text x="532" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">rotation may trust the old and</text>
  <text x="532" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">new authority at once, then</text>
  <text x="532" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">drop the old — verification</text>
  <text x="532" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">is never disabled to do it</text>
  <text x="532" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">operated by the deployment</text>

  <path d="M520 168 L474 200" stroke="#9a6700" stroke-width="2" marker-end="url(#t-amber)"/>

  <rect x="520" y="238" width="216" height="104" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="532" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#11181c">HTTPS upstream</text>
  <text x="532" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">chain verified, hostname verified,</text>
  <text x="532" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">SNI sent, revocation checked</text>
  <text x="532" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">an https:// upstream without this</text>
  <text x="532" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">is worse than plain HTTP: it looks</text>
  <text x="532" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#57606a">verified and is not</text>

  <path d="M474 262 L516 280" stroke="#57606a" stroke-width="2" marker-end="url(#t-grey)"/>

  <!-- footer -->
  <rect x="290" y="366" width="446" height="110" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="5 3"/>
  <text x="304" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#11181c">not provided by the image</text>
  <text x="304" y="406" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a">certificate authority operation, issuance, and key custody</text>
  <text x="304" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a">renewal automation and expiry alert delivery</text>
  <text x="304" y="438" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a">OCSP, and any revocation check beyond a mounted CRL</text>
  <text x="304" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a">the host cryptographic policy that decides which ciphers are available</text>
  <text x="304" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a">any FIPS claim — no cryptographic boundary has been evidenced</text>

  <defs>
    <marker id="t-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a6700"/>
    </marker>
    <marker id="t-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
