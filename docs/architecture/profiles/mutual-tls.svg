<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 196" width="700" height="196" role="img" aria-labelledby="title desc">
  <title id="title">Request path for the Mutual TLS profile</title>
  <desc id="desc">The request path is client + cert to nginx to /srv/www. The proxy listens on port 8443. Access events leave on standard output and operational messages on standard error.</desc>
  <rect x="0" y="0" width="700" height="196" fill="#ffffff"/>
  <text x="20" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#11181c">Mutual TLS</text>
  <text x="20" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">request path · listener 8443</text>
  <rect x="106" y="92" width="132" height="54" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1"/>
  <text x="172" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#633c01">client + cert</text>
  <text x="172" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">deployment</text>
  <path d="M238 119 L278 119" stroke="#57606a" stroke-width="2" marker-end="url(#p-arrow)"/>
  <rect x="284" y="92" width="132" height="54" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="350" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#11181c">nginx</text>
  <path d="M416 119 L456 119" stroke="#57606a" stroke-width="2" marker-end="url(#p-arrow)"/>
  <rect x="462" y="92" width="132" height="54" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1"/>
  <text x="528" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#633c01">/srv/www</text>
  <text x="528" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#633c01">deployment</text>
  <text x="20" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a">non-root · no capabilities · read-only root · access events on stdout, operational messages on stderr</text>
  <defs>
    <marker id="p-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
