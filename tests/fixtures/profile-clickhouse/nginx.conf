worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8123;
        server_name _;

        client_max_body_size 32m;

        # This fixture stands in for the ClickHouse HTTP interface. It reports
        # what the proxy forwarded and can return an exception code on demand,
        # which covers the part the proxy profile owns. It executes nothing and
        # implements no part of the ClickHouse protocol.
        #
        # A request carrying `fail=1` answers like a ClickHouse error so the
        # proxy's handling of the exception-code header can be exercised.
        location / {
            default_type application/json;

            if ($arg_fail = 1) {
                add_header X-ClickHouse-Exception-Code 241 always;
                return 500 '{"error":"stand-in exception"}';
            }

            add_header X-ClickHouse-Summary '{"read_rows":"0"}' always;
            return 200 '{"request_id":"$http_x_request_id","method":"$request_method","forwarded_proto":"$http_x_forwarded_proto","content_length":"$http_content_length"}\n';
        }
    }
}
