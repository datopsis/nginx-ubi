worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;

        # $hostname is the container hostname, which the pool test sets per
        # member. It identifies which member served a request without giving
        # each member its own configuration file.
        default_type application/json;
        return 200 '{"member":"$hostname","request_id":"$http_x_request_id","xff":"$http_x_forwarded_for"}\n';
    }
}
