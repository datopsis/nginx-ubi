worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;

        # This fixture stands in for a WebSocket application. It reports what
        # the proxy actually forwarded, which is the part of the handshake the
        # proxy profile owns.
        #
        # A request carrying the upgrade token answers 101, so the test can
        # tell that the Upgrade header survived the proxy. Any other request
        # answers 200 with the headers it observed, so the test can assert the
        # connection disposition the proxy derived. It does not implement the
        # WebSocket protocol itself and exchanges no frames.
        location /ws {
            if ($http_upgrade = websocket) {
                add_header Upgrade websocket always;
                add_header Connection upgrade always;
                return 101;
            }
            default_type application/json;
            return 200 '{"upgrade":"$http_upgrade","connection":"$http_connection","request_id":"$http_x_request_id"}\n';
        }

        location / {
            default_type application/json;
            return 200 '{"upgrade":"$http_upgrade","connection":"$http_connection","request_id":"$http_x_request_id"}\n';
        }
    }
}
